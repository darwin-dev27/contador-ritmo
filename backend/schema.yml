        name: id
        schema:
          type: string
        required: true
      tags:
      - activities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedActivityCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedActivityCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedActivityCreate'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityCreate'
          description: ''
    delete:
      operationId: activities_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - activities
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
