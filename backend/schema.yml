openapi: 3.0.3
info:
  title: TriCalc Pro API — Contador de Ritmo
  version: 1.0.0
  description: Fachada REST API premium para gestionar entrenamientos deportivos,
    material deportivo (Gear), calendario de competiciones (Races) y perfiles deportivos
    de atletas.
paths:
  /api/activities/:
    get:
      operationId: activities_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - activities
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityListList'
          description: ''
    post:
      operationId: activities_create
      tags:
      - activities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivityCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivityCreate'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityCreate'
          description: ''
  /api/activities/{id}/:
    get:
      operationId: activities_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - activities
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityDetail'
          description: ''
    put:
      operationId: activities_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - activities
      requestBody:
        content:
